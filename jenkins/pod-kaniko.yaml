apiVersion: v1
kind: Pod
metadata:
  labels:
    app: jenkins-kaniko-agent
spec:
  serviceAccountName: jenkins

  restartPolicy: Never

  securityContext:
    fsGroup: 1000

  # Map the JFrog registry hostname to its internal VPC IP so Kaniko can resolve it.
  # Replace 10.0.3.100 with the actual IP of your ucjfrog.exlservice.com server.
  extraHosts:
  - hostnames:
    - ucjfrog.exlservice.com
    ip: 10.0.3.100

  volumes:

    - name: workspace-volume
      emptyDir: {}

    - name: docker-config
      secret:
        secretName: jfrog-docker-config

  containers:

  #################################################################
  # Jenkins Agent
  #################################################################

  - name: jnlp

    image: jenkins/inbound-agent:latest-jdk21

    imagePullPolicy: IfNotPresent

    workingDir: /home/jenkins/agent

    tty: true

    volumeMounts:

    - name: workspace-volume
      mountPath: /home/jenkins/agent

  #################################################################
  # Builder Container
  #################################################################

  - name: builder

    image: ucjfrog.exlservice.com/idp-sandbox/ci-builder:v2

    command:

    - cat

    tty: true

    workingDir: /workspace

    volumeMounts:

    - name: workspace-volume
      mountPath: /workspace

  #################################################################
  # Kaniko
  #################################################################

  - name: kaniko

    image: gcr.io/kaniko-project/executor:v1.23.2-debug

    command:

    - /busybox/cat

    tty: true

    workingDir: /workspace

    volumeMounts:

    - name: workspace-volume
      mountPath: /workspace

    - name: docker-config
      mountPath: /kaniko/.docker
