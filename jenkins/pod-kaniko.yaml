apiVersion: v1
kind: Pod
metadata:
  labels:
    app: jenkins-kaniko-agent
spec:
  serviceAccountName: jenkins

  restartPolicy: Never

  securityContext:
    fsGroup: 1000

  volumes:

    - name: workspace-volume
      emptyDir: {}

    - name: docker-config
      secret:
        secretName: jfrog-docker-config

  containers:

  #################################################################
  # Jenkins Agent
  #################################################################

  - name: jnlp

    image: jenkins/inbound-agent:latest-jdk21

    imagePullPolicy: IfNotPresent

    workingDir: /home/jenkins/agent

    tty: true

    volumeMounts:

    - name: workspace-volume
      mountPath: /home/jenkins/agent

  #################################################################
  # Builder Container
  #################################################################

  - name: builder

    image: ucjfrog.exlservice.com/idp-sandbox/ci-builder:v1

    command:

    - cat

    tty: true

    workingDir: /workspace

    volumeMounts:

    - name: workspace-volume
      mountPath: /workspace

  #################################################################
  # Kaniko
  #################################################################

  - name: kaniko

    image: gcr.io/kaniko-project/executor:v1.23.2-debug

    command:

    - /busybox/cat

    tty: true

    workingDir: /workspace

    volumeMounts:

    - name: workspace-volume
      mountPath: /workspace

    - name: docker-config
      mountPath: /kaniko/.docker
